<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f4f4f4; padding: 50px 10px; }
        .login-box { background: white; padding: 30px; border-radius: 8px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="text"], input[type="password"] { width: 90%; padding: 10px; margin: 10px 0 20px 0; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px;}
        button { width: 100%; padding: 12px; font-size: 1.1rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-weight: bold; margin-bottom: 15px; }
        a { display: inline-block; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>管理者ログイン</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <label style="text-align: left; display: block; margin-left: 5%;">管理者ID</label>
            <input type="text" name="username" required>

            <label style="text-align: left; display: block; margin-left: 5%;">パスワード</label>
            <input type="password" name="password" required>

            <button type="submit">ログイン</button>
        </form>
        <a href="/">← トップページへ戻る</a>
    </div>
</body>
</html>
